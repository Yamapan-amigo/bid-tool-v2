[project]
name = "bid-tool-v2"
version = "2.0.0"
description = "入札情報収集ツール V2 — 官公需API + e-Tokyo → Google Spreadsheet"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.33.0,<3",
    "beautifulsoup4>=4.12.0,<5",
    "lxml>=5.0.0,<7",
    "gspread>=6.0.0,<7",
    "google-auth>=2.0.0,<3",
    "python-dotenv>=1.0.0,<2",
    "defusedxml>=0.7.1,<0.8",
    "google-generativeai>=0.8.0,<0.9",
    "pdfplumber>=0.11.0,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10",
    "pytest-cov>=5.0.0,<8",
    "ruff>=0.5.0,<0.18",
    "bandit>=1.7.0,<2",
]

[project.scripts]
bidtool = "src.main:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/web.py" = ["E501"]
"src/core/extractor.py" = ["E501"]
"src/core/summarizer.py" = ["E501"]
"src/sources/kkj.py" = ["E501"]
"tests/test_filter.py" = ["E501"]
"tests/test_kkj_integration.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
